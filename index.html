<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Balaji Digital Hub - Backup V5</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#222}
.container{width:100%;max-width:520px;margin:auto;padding:18px}
.header{background:#111827;color:#fff;padding:22px;border-radius:18px;text-align:center}
.header h1{margin:0 0 8px}
.card,.admin-box{background:#fff;padding:20px;margin-top:18px;border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,.08);overflow:hidden}
.price{font-size:30px;font-weight:bold;margin:10px 0}
.old{color:#888;text-decoration:line-through;font-size:18px;margin-right:8px}
.offer{color:#16833b;font-weight:bold}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:17px;font-weight:bold}
button.secondary{background:#111827}
input{width:100%;padding:13px;margin-top:10px;border:1px solid #ccc;border-radius:9px;font-size:16px;max-width:100%}
select{max-width:100%}
.page{display:none}.page.active{display:block}
.success{text-align:center;color:#16833b;font-weight:bold;font-size:22px}
.order{background:#eef4ff;padding:15px;border-radius:10px;margin-top:15px;overflow-wrap:anywhere}
.invoice{border:2px solid #222;padding:18px;margin-top:15px;background:#fff}
.invoice h2{text-align:center}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #ddd;flex-wrap:wrap;overflow-wrap:anywhere}
.small{font-size:13px;color:#666;margin-top:12px;text-align:center}
.announcement{background:#fff7d6;color:#7a4b00;padding:11px 14px;border-radius:10px;margin-top:15px;font-weight:bold;text-align:center}
.admin-wrap{display:none;padding:20px;width:100%;max-width:650px;margin:auto;overflow-x:hidden}
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:15px 0}
.admin-stat{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px #ddd;min-width:0;overflow-wrap:anywhere}
.product-admin{border:1px solid #ddd;padding:12px;margin-top:10px;border-radius:8px;overflow-wrap:anywhere}
.admin-btn{width:auto;padding:10px 12px;font-size:14px;margin-right:5px}
.danger{background:#dc2626}.success-btn{background:#16833b}.muted{color:#666}
.info{background:#eef4ff;padding:12px;border-radius:10px;margin-top:10px}
.report-period{border:1px solid #ddd;padding:12px;border-radius:10px;margin-top:10px}
.report-period h4{margin:0 0 8px}
@media(max-width:380px){.container{padding:12px}.admin-wrap{padding:12px}.admin-grid{grid-template-columns:1fr}.row{display:block}.row span,.row strong{display:block;margin-bottom:4px}}

.brand-head{display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
.balaji-logo{width:58px;height:58px;object-fit:contain;flex:0 0 58px}
.brand-head h1{margin:0 0 6px}
.brand-head p{margin:0}
@media(max-width:380px){.balaji-logo{width:50px;height:50px;flex-basis:50px}.brand-head{gap:7px}.brand-head h1{font-size:23px}.brand-head p{font-size:13px}}
</style>
</head>
